# === Serial / Shell ===
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_EARLY_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="mesh:~$ "
# Disable tab autocomplete — Zephyr's common_beginning_find faults
# on noisy input (see feedback_zephyr_shell_tab_crash.md).
CONFIG_SHELL_TAB=n
# BT shell defaulted IN with SHELL+BT and shipped in fleet images —
# ~KBs of code/RAM no product path uses (E2E = REST only).  Freed to
# fit the CORRECT iram placement of the arch core (task #46).
CONFIG_BT_SHELL=n
# history buffer = 512B of RAM for arrow-key recall on a bench console
CONFIG_SHELL_HISTORY=n
CONFIG_MAIN_STACK_SIZE=6144
# `ota_client_check` / `_download` put two 1280 B CoAP buffers + a
# 512 B resp_json on the shell stack (~3.3 KB before library frames).
# 4 KB is not enough — overflow smashes neighbouring thread TCBs and
# the deferred logging thread faults on its next wake-up.  Bump.
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y

# === Networking core ===
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IPV6_MLD=y          # Required by mDNS (joins ff02::fb multicast)
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# net shell = bench debug; product path is REST-only (freed for the
# correct iram placement, task #46)
CONFIG_NET_SHELL=n

# === OpenThread FTD ===
CONFIG_OPENTHREAD_FTD=y
# OPENTHREAD_SHELL pulls libopenthread-cli-ftd.a (10+ KB code, ~3 KB BSS)
# which expands further once Link Metrics CLI commands are linked.  Disable
# to fit Thread 1.2 + Link Metrics in 488 KB SRAM.  The app-side `mesh ...`
# command tree (nn_osal_shell-based) is unaffected; only `ot ...` commands
# go away.  Use UART boot logs + `nn-hub events` for OT introspection.
CONFIG_OPENTHREAD_SHELL=n
# OPENTHREAD_PING_SENDER is purely a `ot ping` diagnostic — disabled here
# to free ~4 KB of code+BSS so the Thread 1.2 Link Metrics path fits in
# ESP32-C6's 488 KB SRAM.  Re-enable when actively debugging on UART.
CONFIG_OPENTHREAD_PING_SENDER=n
# Thread joiner-protocol path is disabled in favour of the BLE-pushes-
# dataset onboarding flow (`nn-hub device new --dataset-hex …`).
# Re-enable both if you ever want to use OT MeshCoP commissioning:
#   CONFIG_OPENTHREAD_COMMISSIONER=y  — needed for /commission/add CoAP
#   CONFIG_OPENTHREAD_JOINER=y        — needed for `ot joiner start`
# The /commission/add CoAP resource in coap_info.c is also gated on
# CONFIG_OPENTHREAD_COMMISSIONER and is compiled out when this is n.
CONFIG_OPENTHREAD_COMMISSIONER=n
CONFIG_OPENTHREAD_JOINER=n
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6144
# Never auto-start from NVS — 802.15.4 is disabled at boot for BLE PHY init.
CONFIG_OPENTHREAD_MANUAL_START=y
# SLAAC: auto-configure OMR addresses from border router prefix advertisements.
# Required for hub→device CoAP reachability via Thread Border Router.
CONFIG_OPENTHREAD_SLAAC=y

# Thread 1.2 mode — required for Link Metrics support.  The default in this
# tree is 1.1 (set by Kconfig.features default).  Link Metrics types are
# gated on `OPENTHREAD_THREAD_VERSION_1_2 || _1_3 || ..` in OT's headers,
# so flipping the version is enough to enable them.  1.2 is the minimum
# spec that introduced Link Metrics; we don't need 1.3/1.4 features.
CONFIG_OPENTHREAD_THREAD_VERSION_1_2=y

# Thread 1.2 Link Metrics — fixes asymmetric-route route-cost convergence.
# Without these, OT computes route cost only from MLE Advertisement (broadcast)
# reception quality; broadcasts go out at higher TX power than unicast on
# ESP32-C6, so a peer whose unicast path is broken stays advertised as a
# direct neighbor and cascades dump AUTO_NOTIFY into the dead path forever.
# Link Metrics adds bidirectional active probing so OT can detect and
# demote those asymmetric links within a couple of MLE intervals.
#   INITIATOR  — query metrics from peers
#   SUBJECT    — respond to other peers' queries
#   MANAGER    — periodically probe each connected neighbor and feed the
#                result into the route cost calculation
# All three must be set; MANAGER asserts on INITIATOR at compile time.
CONFIG_OPENTHREAD_LINK_METRICS_INITIATOR=y
CONFIG_OPENTHREAD_LINK_METRICS_SUBJECT=y
CONFIG_OPENTHREAD_LINK_METRICS_MANAGER=y

# === mDNS responder (answers <hostname>.local queries) ===
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_MDNS_RESPONDER=y

# === DNS resolver with mDNS support (resolves <hostname>.local) ===
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=1
CONFIG_DNS_NUM_CONCUR_QUERIES=3
# net_sock_svc monitors DNS resolver + mDNS responder sockets.
# Default ZVFS_POLL_MAX=3 is too small; set to 8 to cover all services.
CONFIG_ZVFS_POLL_MAX=8

# Required for OT L2 to propagate IPv6 multicast joins (e.g. ff02::fb) to
# otIp6SubscribeMulticastAddress.  Without this the OT l2 event handler
# receives NET_EVENT_IPV6_MADDR_ADD with a NULL info pointer and never
# subscribes, so mDNS multicast queries are silently dropped by OT.
CONFIG_NET_MGMT_EVENT_INFO=y

# === Flash / NVS / Settings (OT dataset + BLE prov flag + device name) ===
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# === Bluetooth (dual-role: peripheral + central for provisioning) ===
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="OT-Node"
CONFIG_BT_MAX_CONN=2
CONFIG_BT_L2CAP_TX_MTU=260
CONFIG_BT_BUF_ACL_RX_SIZE=264
CONFIG_BT_BUF_ACL_TX_SIZE=264
# M6: encrypted DATASET_CHAR envelope (JSON + base64) is ~200B.
# At default ATT MTU=23, Write Long fragments into ~18B chunks → up
# to 12 prepare slots needed.  16 leaves headroom.
CONFIG_BT_ATT_PREPARE_COUNT=16
CONFIG_BT_SHELL=y

# === RF coexistence: manual (BLE and 802.15.4 never simultaneously) ===
CONFIG_ESP32_SW_COEXIST_ENABLE=n

# === CoAP (hub ↔ device protocol) ===
CONFIG_COAP=y

# === OTA: MCUboot image manager + stream flash for Block2 downloads ===
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_IMG_BLOCK_BUF_SIZE=1024

# === PSA Crypto (for ECIES v2: X25519 ECDH + HKDF-SHA256 + AES-256-GCM) ===
# PSA_WANT_* symbols are invisible when MBEDTLS_PROMPTLESS=y and cannot be
# set here — they are pulled in via 'select' in node_mgr/Kconfig instead.
# Default heap (512 B) is too small for X25519 ECDH + HKDF + AES-GCM.
#
# 12 KB was tight: after a sustained sign load (e.g. OTA block downloads,
# 1 sign per block + 1 verify), mbedtls's internal allocator slowly
# fragments and psa_sign_message starts returning -141 INSUFFICIENT_MEMORY
# permanently until reboot.  Bump to 64 KB — gives plenty of headroom
# for the deterministic ECDSA sign workspace (~3 KB) plus the
# X25519 ECDH + HKDF + AES-GCM stack used during ECIES decrypt, with
# room left to fragment.
CONFIG_MBEDTLS_HEAP_SIZE=65536
# Temporary: introspect mbedtls heap to find PSA-141 root cause.
CONFIG_MBEDTLS_MEMORY_DEBUG=y
# Append our TF-PSA user config to enable MBEDTLS_THREADING_C +
# MBEDTLS_THREADING_ALT.  See apps/mdns_ot_esp32c6/include/
# tf_psa_user_config.h and src/mbedtls_threading_zephyr.c.
CONFIG_TF_PSA_CRYPTO_USER_CONFIG_FILE="tf_psa_user_config.h"

# === JSON for envelope parsing ===
CONFIG_JSON_LIBRARY=y

# === Base64 for ECIES envelope encoding ===
CONFIG_BASE64=y

# === Logging ===
CONFIG_LOG=y
# Was 8192; tried 4096 and it Z-FATAL'd on boot (logging thread stack
# overflow once Thread 1.2 + Link Metrics started emitting their own
# events).  6144 fits and survives boot; the SRAM headroom comes from
# the NET_BUF_RX_COUNT trim further down.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=6144
# BLE provisioning's apply_dataset_work_handler runs on the system
# workqueue and calls otDatasetSetActiveTlvs() + Thread start, which
# overflows the default 1024B sysworkq stack.  Bumped to 4096 originally,
# then raised again to 12288 — the sensor_pump_work runs on the same
# system workqueue and fires the auto_engine cascade, which on a
# cross-device rule recurses through notify_targets → send_d2d_reliable
# → rel_burst_fire → rel_send_one (inner[774]) → send_signed_frame
# (~1 KB) → PSA sign (~1 KB).  Matches the field_relay worker bump.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
# BLE GATT write callbacks (hub_config_cb / dataset_cb) run on the BT
# RX thread and call PSA crypto + settings_save_one — defaults of
# 1200/1300 bytes overflow.  Bump both BT thread stacks to 4096.
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_LONG_WQ_STACK_SIZE=4096
CONFIG_PRINTK=y
# Ensure printk goes directly to UART, not through the log subsystem.
# Needed for OTA progress output while log thread is suspended.
CONFIG_LOG_PRINTK=n
CONFIG_NET_LOG=y
# Remote syslog via Zephyr's built-in net backend (UDP to hub).
# Server address set at runtime via log_backend_net_set_addr().
# Remote logging: coap_log backend (like log_backend_mqtt pattern).
# LOG_ALWAYS_RUNTIME was needed for coap_log backend but causes flash
# XIP crashes during OTA.  Disabled for now — coap_log backend won't
# receive messages until runtime filter is set.
# CONFIG_LOG_ALWAYS_RUNTIME=y
CONFIG_OPENTHREAD_L2_LOG_LEVEL_WRN=y
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_WRN=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=512

# === Network buffers ===
# Doubled from 64/128 pkts and 128/32 bufs (see git log) — gives
# headroom for concurrent FIELD_OP relay traffic + OTA Block2 fragments
# + mDNS responder.  Helps but does NOT close the residual net_pkt
# alloc FAILED rate observed during E2E FIELD_REPLY testing on c6-s1
# (~0.5/s during idle) — that's a deeper Zephyr OT L2 leak per
# feedback_zephyr_zsock_net_buf_leak.md.  NET_BUF_POOL_USAGE turned on
# so `net mem` shell prints per-pool high-water marks for future debug.
# NET pool was bumped 2x for FIELD_REPLY back-pressure headroom; the
# real fix was async dispatch in field_relay (nn-modules@69c0cc7) so
# the 2x is no longer load-bearing.  Trimming RX from 256 → 192 frees
# ~8 KB BSS, which is what made Thread 1.2 + Link Metrics fit.
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=32
# 192 -> 184 (2026-09-25): the hermetic build (SDK 1.0.1, ISR code in IRAM)
# overflowed sram0_0_seg by 464 B after radio stats / channel scan /
# nearest-gateway state; RX pools measured never below 192/192 free.
CONFIG_NET_BUF_RX_COUNT=184
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_POOL_USAGE=y
# Default NET_MAX_CONN=8 fills with mDNS×2 + CoAP server + messenger +
# nn_proto_client + OTA bind, leaving no slot for ota_client's outbound
# CoAP socket; symptom is errno=2 (ENOENT) on bind/sendto.  See
# memory/feedback_zephyr_net_max_conn.md.
CONFIG_NET_MAX_CONN=24

# Phase 3: drive on-board WS2812 LED (GPIO 8) for "led" actuator demo.
# Use I2S + DMA (Espressif's reference) — SPI driver doesn't generate
# clean back-to-back WS2812 frames on ESP32-C6 (FSPI adds inter-byte
# idle gaps that prevent the chip from latching subsequent updates).
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_I2S=y
CONFIG_I2S=y
CONFIG_DMA=y

# Phase 3: on-board BOOT button (GPIO 9) as a "button" sensor field.
# Pick TOGGLE — each press flips the value; FLIP would mirror the
# physical button (1 while held, 0 released).
CONFIG_NODE_MGR_BUTTON=y
CONFIG_NODE_MGR_BUTTON_TOGGLE=y
CONFIG_NN_PAL=y

# Firmware identity: BLE FW_NAME char + INFO_REPLY img + OTA catalog key.
CONFIG_NODE_MGR_IMAGE_NAME="nn-app-mdns-ot-esp32c6"

# Floats in logs and the shell ("%f"): without this cbprintf prints "*float*".
# The field-push JSON no longer depends on it, but log lines and
# `mesh auto get` still do.
CONFIG_CBPRINTF_FP_SUPPORT=y


# one copy per reliable-send attempt: the fixed 802.15.4 driver lets
# OpenThread retry lost frames; 3 copies only congested the channel
CONFIG_NODE_MGR_NN_PROTO_RELIABLE_FIRE_BURST=1
