SB_CONFIG_BOOTLOADER_MCUBOOT=y
# OVERWRITE_ONLY: chosen as the operationally-working mode in our current
# stack (Zephyr 4.4, mbedtls 4.x, OpenThread, tf-psa-crypto).  Investigated
# 2026-05-19:
#  - OVERWRITE_ONLY hangs on *warm* reset triggered by sys_reboot after
#    boot_request_upgrade.  UART silent right after ESP-IDF's "SPI Flash
#    Size : 8MB", before MCUboot's own "Starting bootloader".  Operator
#    workaround: cold power-cycle after `mesh ota apply`.
#  - SWAP_SCRATCH (the historically working mode per project_ota_ab_swap.md)
#    works on cold boot but takes ~25 min on a 1.79 MB image (vs ~30 s for
#    OVERWRITE_ONLY).  Also hangs on warm reset.
#  - DIRECT_XIP is "CURRENTLY UNSUPPORTED" upstream in MCUboot's espressif
#    port (boot/espressif/hal/include/mcuboot_config/mcuboot_config.h:62)
#    — falls through to SWAP_USING_SCRATCH silently and produces a
#    bootloader that hangs on any cold boot with two populated slots.
# Documented in feedback_mcuboot_warm_reset_swap_hang.md.  Active mode:
# OVERWRITE_ONLY, accept cold-cycle-after-apply workflow.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
